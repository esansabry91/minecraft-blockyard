<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12182b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Game Box">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Family Game Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Press+Start+2P&display=swap">
<style>
/* Lobby: pick a game. Each game lives in games/<id>/index.html and is listed in GAMES below. */
:root {
  color-scheme: dark;
  --bg: #12182b;
  --panel: #2a2118;
  --panel-2: #3b2f22;
  --ink: #f5ecd6;
  --ink-dim: #c9bb9c;
  --accent: #ffcf3f;
  --accent-ink: #2a2118;
  --line: #0c0906;
  --font-display: "Press Start 2P", ui-monospace, Menlo, monospace;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
body { padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
main { max-width: 960px; margin: 0 auto; }
h1 { font: 22px/1.4 var(--font-display); color: var(--accent); text-align: center; margin: 8px 0 4px; text-shadow: 3px 3px 0 var(--line); }
.sub { text-align: center; color: var(--ink-dim); font-weight: 800; margin: 0 0 24px; }
#games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; list-style: none; padding: 0; margin: 0; }
.card { display: flex; flex-direction: column; height: 100%; text-decoration: none; color: var(--ink); background: var(--panel); border: 4px solid var(--line); border-radius: 10px; overflow: hidden; transition: transform .12s; }
.card:hover, .card:focus-visible { transform: translateY(-3px); outline: 3px solid var(--accent); outline-offset: 2px; }
.card:active { transform: scale(.98); }
.art { aspect-ratio: 16 / 9; display: grid; place-items: center; font-size: 64px; background: var(--panel-2); border-bottom: 4px solid var(--line); }
.art img { width: 100%; height: 100%; object-fit: cover; }
.info { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.info strong { font: 13px/1.4 var(--font-display); }
.info span { color: var(--ink-dim); font-weight: 600; font-size: 15px; }
.play { margin-top: auto; align-self: flex-start; font: 11px var(--font-display); background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border: 3px solid var(--line); border-radius: 6px; }
.soon { opacity: .5; pointer-events: none; }
.soon .play { background: var(--panel-2); color: var(--ink-dim); }
</style>
</head>
<body>
<main>
  <h1>Family Game Box</h1>
  <p class="sub">Pick a game to play!</p>
  <ul id="games"></ul>
</main>
<script>
// To add a game: put it in games/<id>/index.html, then add a line here.
// art can be an emoji or an image path (e.g. "games/racer/cover.png").
const GAMES = [
  { id: 'blockyard', name: 'Blockyard', blurb: 'Build, dig, find treasure and play with friends.', art: '⛏️', bg: '#3f7d3a' },
  { id: null, name: 'Coming soon', blurb: 'Your next game goes here.', art: '❓' },
];

const list = document.getElementById('games');
for (const g of GAMES) {
  const li = document.createElement('li');
  const a = document.createElement(g.id ? 'a' : 'div');
  a.className = 'card' + (g.id ? '' : ' soon');
  if (g.id) a.href = `games/${g.id}/index.html`;
  const isImg = /\.(png|jpe?g|webp|gif|svg)$/i.test(g.art || '');
  a.innerHTML = `
    <div class="art"${g.bg ? ` style="background:${g.bg}"` : ''}>${isImg ? `<img alt="" src="${g.art}">` : (g.art || '🎮')}</div>
    <div class="info"><strong></strong><span></span><div class="play">${g.id ? 'PLAY' : 'SOON'}</div></div>`;
  a.querySelector('strong').textContent = g.name;
  a.querySelector('span').textContent = g.blurb;
  li.appendChild(a);
  list.appendChild(li);
}
</script>
</body>
</html>
