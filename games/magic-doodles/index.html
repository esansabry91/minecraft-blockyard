<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12182b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Magic Doodles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Press+Start+2P&display=swap">
<style>
/* Two screens: a paper to draw on, and a 3D island where drawings come alive. Same dark wood-and-gold look as the other games. */
:root {
  color-scheme: dark;
  --bg: #12182b;
  --panel: #2a2118;
  --panel-2: #3b2f22;
  --ink: #f5ecd6;
  --ink-dim: #c9bb9c;
  --accent: #ffcf3f;
  --accent-ink: #2a2118;
  --line: #0c0906;
  --font-display: "Press Start 2P", ui-monospace, Menlo, monospace;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button { font-family: inherit; cursor: pointer; color: inherit; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* Drawing screen */
#draw { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); gap: 10px; }
.top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.top h1 { font: 18px var(--font-display); color: var(--accent); margin: 0; flex: 1; text-align: center; }
.back { color: var(--ink-dim); font-weight: 800; font-size: 14px; text-decoration: none; white-space: nowrap; }
.chip { padding: 8px 12px; border: 3px solid var(--line); border-radius: 10px; background: var(--panel-2); font: 800 14px var(--font-body); white-space: nowrap; }
.body { flex: 1; min-height: 0; display: flex; gap: 12px; align-items: center; justify-content: center; }
.paperBox { position: relative; aspect-ratio: 1; height: 100%; max-width: calc(100vw - 330px); max-height: 100%; background: #fff; border: 4px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,.35); flex-shrink: 1; }
#paper { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#hintTxt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: #b9b2a3; font-weight: 800; font-size: 20px; pointer-events: none; }
.tools { width: 300px; max-height: 100%; overflow-y: auto; background: var(--panel); border: 4px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tools h2 { font: 10px var(--font-display); color: var(--ink-dim); margin: 2px 0 0; letter-spacing: 1px; }
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.row.two { grid-template-columns: 1fr 1fr; }
.row.three { grid-template-columns: repeat(3, 1fr); }
.tb { min-height: 46px; background: var(--panel-2); border: 3px solid var(--line); border-radius: 8px; font: 800 12px/1.1 var(--font-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.tb .ic { font-size: 20px; line-height: 1; }
.tb.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.dot { border-radius: 50%; background: var(--ink); display: block; }
.colors { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.sw { aspect-ratio: 1; border: 3px solid var(--line); border-radius: 50%; padding: 0; }
.sw.on { box-shadow: 0 0 0 3px var(--accent); }
#createBtn { position: sticky; bottom: 0; padding: 14px; font: 15px var(--font-display); background: var(--accent); color: var(--accent-ink); border: 4px solid var(--line); border-radius: 10px; box-shadow: 0 -10px 0 var(--panel); }
@media (max-aspect-ratio: 1/1), (max-width: 700px) {
  .body { flex-direction: column; }
  .paperBox { height: auto; width: 100%; max-width: min(100%, calc(100vh - 360px)); }
  .tools { width: 100%; max-width: 640px; flex: 1; }
}

/* World screen HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#hudTop { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 10px; align-items: center; pointer-events: none; }
#hudTop > * { pointer-events: auto; }
.bigChip { padding: 12px 16px; font: 800 16px var(--font-body); background: var(--accent); color: var(--accent-ink); border: 4px solid var(--line); border-radius: 12px; }
#tip { position: absolute; left: 50%; transform: translateX(-50%); bottom: 112px; background: rgba(42,33,24,.85); border: 3px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: 15px; text-align: center; max-width: 90vw; pointer-events: none; }
#strip { position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; overflow-x: auto; padding: 0 12px; justify-content: safe center; }
.thumb { position: relative; flex: 0 0 auto; width: 84px; height: 84px; background: rgba(255,255,255,.92); border: 4px solid var(--line); border-radius: 10px; padding: 4px; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.thumb.on { border-color: var(--accent); }
.thumb .x { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); background: #e53935; color: #fff; font: 800 13px/1 var(--font-body); padding: 0; display: grid; place-items: center; }
#toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--panel); border: 4px solid var(--line); border-radius: 12px; padding: 12px 18px; font-weight: 800; font-size: 18px; text-align: center; max-width: 90vw; z-index: 9; pointer-events: none; }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div id="draw">
  <div class="top">
    <a class="back" href="../../index.html">&larr; All games</a>
    <h1>Magic Doodles</h1>
    <button class="chip" id="toWorldBtn" type="button" hidden>&#127757; My world</button>
  </div>
  <div class="body">
    <div class="paperBox">
      <canvas id="paper" width="640" height="640"></canvas>
      <div id="hintTxt">Draw a creature or a thing here!<br>Color it in, then tap CREATE.</div>
    </div>
    <div class="tools">
      <div class="row" id="toolRow">
        <button class="tb on" type="button" data-tool="brush"><span class="ic">&#9999;&#65039;</span>Pen</button>
        <button class="tb" type="button" data-tool="fill"><span class="ic">&#129699;</span>Fill</button>
        <button class="tb" type="button" data-tool="eyes"><span class="ic">&#128064;</span>Eyes</button>
        <button class="tb" type="button" data-tool="eraser"><span class="ic">&#129533;</span>Rub out</button>
      </div>
      <div class="row three" id="sizeRow">
        <button class="tb" type="button" data-size="6" aria-label="Thin"><span class="dot" style="width:6px;height:6px"></span></button>
        <button class="tb on" type="button" data-size="14" aria-label="Medium"><span class="dot" style="width:12px;height:12px"></span></button>
        <button class="tb" type="button" data-size="30" aria-label="Thick"><span class="dot" style="width:22px;height:22px"></span></button>
      </div>
      <div class="colors" id="colors"></div>
      <div class="row two">
        <button class="tb" type="button" id="undoBtn"><span class="ic">&#8617;&#65039;</span>Undo</button>
        <button class="tb" type="button" id="clearBtn"><span class="ic">&#128465;&#65039;</span>Start over</button>
      </div>
      <h2>WHAT DID YOU DRAW?</h2>
      <div class="row two" id="kindRow">
        <button class="tb on" type="button" data-kind="creature"><span class="ic">&#128062;</span>Creature or person</button>
        <button class="tb" type="button" data-kind="thing"><span class="ic">&#129528;</span>Thing or toy</button>
      </div>
      <div id="faceBox">
        <h2>WHICH WAY IS IT LOOKING?</h2>
        <div class="row three" id="faceRow" style="margin-top:6px">
          <button class="tb" type="button" data-face="left"><span class="ic">&#11013;&#65039;</span>Left</button>
          <button class="tb on" type="button" data-face="front"><span class="ic">&#128578;</span>At me</button>
          <button class="tb" type="button" data-face="right"><span class="ic">&#10145;&#65039;</span>Right</button>
        </div>
      </div>
      <button id="createBtn" type="button">&#10024; CREATE!</button>
    </div>
  </div>
</div>

<div id="hud" hidden>
  <div id="hudTop">
    <button class="bigChip" id="drawBtn" type="button">&#9999;&#65039; Draw another</button>
  </div>
  <div id="tip">Tap a doodle to make it jump! Tap the grass to make it walk there.</div>
  <div id="strip"></div>
</div>
<div id="toast" hidden></div>

<script src="../shared/three.r128.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const STORE_KEY = 'magicdoodles-v1';
const MAX_DOODLES = 16;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function loadDoodles() { try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveDoodles(list) {
  // keep dropping the oldest drawings until it fits in the browser's storage
  const l = list.slice(-MAX_DOODLES);
  while (l.length) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(l)); return l; } catch (e) { l.shift(); }
  }
  return l;
}

let toastT = 0;
function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms);
}

// ---------- Sound ----------
const Sound = {
  ctx: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } } if (this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  magic() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.12, 0, i * 0.07)); },
  boing() { this.tone(180, 0.35, 'sine', 0.2, 260); },
  blip() { this.tone(660, 0.06, 'square', 0.05); },
};

// ======================================================================
// Drawing
// ======================================================================
const COLORS = ['#1b1b1b', '#ffffff', '#e53935', '#ff7043', '#ffb300', '#fdd835', '#7cb342', '#2e7d32',
  '#00acc1', '#1e88e5', '#3949ab', '#8e24aa', '#ec407a', '#f8bbd0', '#8d6e63', '#9e9e9e'];
const paper = $('paper'), pctx = paper.getContext('2d', { willReadFrequently: true });
const pen = { tool: 'brush', size: 14, color: COLORS[0], kind: 'creature', face: 'front' };
const undoStack = [];
let drawn = false;

function pushUndo() {
  undoStack.push(pctx.getImageData(0, 0, paper.width, paper.height));
  if (undoStack.length > 15) undoStack.shift();
}
function markDrawn() { drawn = true; $('hintTxt').hidden = true; }
function clearPaper() { pctx.clearRect(0, 0, paper.width, paper.height); drawn = false; $('hintTxt').hidden = false; }

(function buildPalette() {
  const box = $('colors');
  COLORS.forEach((c, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (i === 0 ? ' on' : '');
    b.style.background = c; b.setAttribute('aria-label', 'Color ' + c);
    b.addEventListener('click', () => {
      pen.color = c; box.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b));
      if (pen.tool === 'eraser' || pen.tool === 'eyes') selectTool('brush');
    });
    box.appendChild(b);
  });
})();
function selectTool(t) { pen.tool = t; document.querySelectorAll('#toolRow .tb').forEach(b => b.classList.toggle('on', b.dataset.tool === t)); }
document.querySelectorAll('#toolRow .tb').forEach(b => b.addEventListener('click', () => selectTool(b.dataset.tool)));
document.querySelectorAll('#sizeRow .tb').forEach(b => b.addEventListener('click', () => { pen.size = +b.dataset.size; document.querySelectorAll('#sizeRow .tb').forEach(x => x.classList.toggle('on', x === b)); }));
document.querySelectorAll('#kindRow .tb').forEach(b => b.addEventListener('click', () => { pen.kind = b.dataset.kind; document.querySelectorAll('#kindRow .tb').forEach(x => x.classList.toggle('on', x === b)); $('faceBox').hidden = pen.kind !== 'creature'; }));
document.querySelectorAll('#faceRow .tb').forEach(b => b.addEventListener('click', () => { pen.face = b.dataset.face; document.querySelectorAll('#faceRow .tb').forEach(x => x.classList.toggle('on', x === b)); }));
$('undoBtn').addEventListener('click', () => {
  const s = undoStack.pop(); if (!s) return;
  pctx.putImageData(s, 0, 0);
  const d = s.data; let any = false; for (let i = 3; i < d.length; i += 16) if (d[i]) { any = true; break; }
  if (!any) clearPaper();
});
$('clearBtn').addEventListener('click', () => { if (!drawn) return; pushUndo(); clearPaper(); });

function paperXY(e) {
  const r = paper.getBoundingClientRect();
  return [(e.clientX - r.left) * paper.width / r.width, (e.clientY - r.top) * paper.height / r.height];
}
let stroke = null;
function strokeTo(x, y) {
  pctx.lineTo(x, y); pctx.stroke();
  pctx.beginPath(); pctx.moveTo(x, y);
}
paper.addEventListener('pointerdown', e => {
  e.preventDefault(); Sound.init();
  if (stroke) return;
  const [x, y] = paperXY(e);
  if (pen.tool === 'fill') { pushUndo(); floodFill(Math.floor(x), Math.floor(y), pen.color); markDrawn(); return; }
  if (pen.tool === 'eyes') { pushUndo(); drawEyes(x, y); markDrawn(); return; }
  pushUndo();
  try { paper.setPointerCapture(e.pointerId); } catch (_) {}
  stroke = { id: e.pointerId };
  pctx.globalCompositeOperation = pen.tool === 'eraser' ? 'destination-out' : 'source-over';
  pctx.strokeStyle = pctx.fillStyle = pen.color;
  pctx.lineWidth = pen.tool === 'eraser' ? pen.size * 1.6 : pen.size;
  pctx.lineCap = pctx.lineJoin = 'round';
  pctx.beginPath(); pctx.arc(x, y, pctx.lineWidth / 2, 0, Math.PI * 2); pctx.fill();
  pctx.beginPath(); pctx.moveTo(x, y);
  if (pen.tool !== 'eraser') markDrawn();
});
paper.addEventListener('pointermove', e => {
  if (!stroke || e.pointerId !== stroke.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) { const [x, y] = paperXY(ev); strokeTo(x, y); }
});
const endStroke = e => { if (!stroke || e.pointerId !== stroke.id) return; stroke = null; pctx.globalCompositeOperation = 'source-over'; };
paper.addEventListener('pointerup', endStroke);
paper.addEventListener('pointercancel', endStroke);
paper.addEventListener('contextmenu', e => e.preventDefault());

function drawEyes(x, y) {
  const r = Math.max(14, pen.size * 1.2);
  for (const dx of [-r * 1.15, r * 1.15]) {
    pctx.beginPath(); pctx.arc(x + dx, y, r, 0, Math.PI * 2);
    pctx.fillStyle = '#fff'; pctx.fill(); pctx.lineWidth = Math.max(3, r * 0.18); pctx.strokeStyle = '#1b1b1b'; pctx.stroke();
    pctx.beginPath(); pctx.arc(x + dx + r * 0.15, y + r * 0.2, r * 0.48, 0, Math.PI * 2); pctx.fillStyle = '#1b1b1b'; pctx.fill();
    pctx.beginPath(); pctx.arc(x + dx + r * 0.3, y + r * 0.02, r * 0.14, 0, Math.PI * 2); pctx.fillStyle = '#fff'; pctx.fill();
  }
}

function floodFill(sx, sy, hexColor) {
  const W = paper.width, H = paper.height;
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  const img = pctx.getImageData(0, 0, W, H), d = img.data;
  const fr = parseInt(hexColor.slice(1, 3), 16), fg = parseInt(hexColor.slice(3, 5), 16), fb = parseInt(hexColor.slice(5, 7), 16);
  const s = (sy * W + sx) * 4, tr = d[s], tg = d[s + 1], tb = d[s + 2], ta = d[s + 3];
  const same = i => {
    const a = d[i + 3];
    if (ta < 40) return a < 90; // filling empty paper: stop at anything drawn
    return a > 40 && Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) < 110 && Math.abs(a - ta) < 120;
  };
  const filled = new Uint8Array(W * H);
  const stack = [sx, sy];
  while (stack.length) {
    const y = stack.pop(), x0 = stack.pop();
    let x = x0;
    while (x >= 0 && !filled[y * W + x] && same((y * W + x) * 4)) x--;
    x++;
    let up = false, down = false;
    for (; x < W && !filled[y * W + x] && same((y * W + x) * 4); x++) {
      filled[y * W + x] = 1;
      if (y > 0) { const k = (y - 1) * W + x; const m = !filled[k] && same(k * 4); if (m && !up) { stack.push(x, y - 1); up = true; } else if (!m) up = false; }
      if (y < H - 1) { const k = (y + 1) * W + x; const m = !filled[k] && same(k * 4); if (m && !down) { stack.push(x, y + 1); down = true; } else if (!m) down = false; }
    }
  }
  // paint the fill, and slide it 2px under the soft edges of lines so no white halo is left
  const grow = dilate(filled, W, H, 2);
  for (let i = 0; i < W * H; i++) {
    if (!grow[i]) continue;
    const p = i * 4;
    if (filled[i]) { d[p] = fr; d[p + 1] = fg; d[p + 2] = fb; d[p + 3] = 255; continue; }
    const a = d[p + 3] / 255; // existing pixel drawn over the fill colour
    d[p] = d[p] * a + fr * (1 - a); d[p + 1] = d[p + 1] * a + fg * (1 - a); d[p + 2] = d[p + 2] * a + fb * (1 - a); d[p + 3] = 255;
  }
  pctx.putImageData(img, 0, 0);
}

// square dilation of a 0/1 mask by r pixels
function dilate(mask, W, H, r) {
  const tmp = new Uint8Array(W * H), out = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    let cnt = 0; const row = y * W;
    for (let x = 0; x < Math.min(W, r); x++) cnt += mask[row + x];
    for (let x = 0; x < W; x++) {
      if (x + r < W) cnt += mask[row + x + r];
      if (x - r - 1 >= 0) cnt -= mask[row + x - r - 1];
      tmp[row + x] = cnt > 0 ? 1 : 0;
    }
  }
  for (let x = 0; x < W; x++) {
    let cnt = 0;
    for (let y = 0; y < Math.min(H, r); y++) cnt += tmp[y * W + x];
    for (let y = 0; y < H; y++) {
      if (y + r < H) cnt += tmp[(y + r) * W + x];
      if (y - r - 1 >= 0) cnt -= tmp[(y - r - 1) * W + x];
      out[y * W + x] = cnt > 0 ? 1 : 0;
    }
  }
  return out;
}

// ======================================================================
// Drawing -> 3D
// ======================================================================
// Turns the paper into a cut-out picture: closes small gaps in outlines, fills the inside of
// outlined shapes with white paper, and crops it. Returns a canvas (alpha = the shape) or null.
function cutOut(src) {
  const W = src.width, H = src.height, n = W * H;
  const d = src.getContext('2d').getImageData(0, 0, W, H).data;
  const painted = new Uint8Array(n);
  let count = 0;
  for (let i = 0; i < n; i++) if (d[i * 4 + 3] > 20) { painted[i] = 1; count++; }
  if (count < 60) return null;
  const R = 6;
  const thick = dilate(painted, W, H, R);
  const outside = new Uint8Array(n), q = new Int32Array(n);
  let qh = 0, qt = 0;
  const seed = i => { if (!thick[i] && !outside[i]) { outside[i] = 1; q[qt++] = i; } };
  for (let x = 0; x < W; x++) { seed(x); seed((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { seed(y * W); seed(y * W + W - 1); }
  while (qh < qt) {
    const i = q[qh++], x = i % W;
    if (x > 0) seed(i - 1); if (x < W - 1) seed(i + 1); if (i >= W) seed(i - W); if (i < n - W) seed(i + W);
  }
  const notInside = new Uint8Array(n);
  for (let i = 0; i < n; i++) notInside[i] = outside[i];
  const grownOut = dilate(notInside, W, H, R);
  const shape = new Uint8Array(n);
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let i = 0; i < n; i++) {
    if (painted[i] || !grownOut[i]) {
      shape[i] = 1; const x = i % W, y = (i / W) | 0;
      if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  const M = 4;
  minX = Math.max(0, minX - M); minY = Math.max(0, minY - M); maxX = Math.min(W - 1, maxX + M); maxY = Math.min(H - 1, maxY + M);
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const crop = document.createElement('canvas'); crop.width = bw; crop.height = bh;
  const cctx = crop.getContext('2d');

    d.body.rotation.y = spin;
    d.body.rotation.z = d.kind === 'creature' ? Math.sin(d.phase) * 0.07 * d.walk : 0;
    d.body.scale.set(s / Math.sqrt(sq), s * sq, s / Math.sqrt(sq));
    d.root.children[1].scale.x = Math.max(0.6, d.shape.width * 0.45) * (1 - Math.min(0.5, y * 0.2));
  }
  // gently push doodles apart
  for (let i = 0; i < doodles.length; i++) for (let j = i + 1; j < doodles.length; j++) {
    const A = doodles[i], B = doodles[j];
    const dx = B.pos.x - A.pos.x, dz = B.pos.z - A.pos.z, dd = Math.hypot(dx, dz), min = 1.6;
    if (dd < min && dd > 1e-4) { const p = (min - dd) / 2 * Math.min(1, dt * 5); A.pos.x -= dx / dd * p; A.pos.z -= dz / dd * p; B.pos.x += dx / dd * p; B.pos.z += dz / dd * p; }
  }
  if (selected) { ringMesh.visible = true; ringMesh.position.x = selected.pos.x; ringMesh.position.z = selected.pos.z; ringMesh.rotation.y += dt; }
  else ringMesh.visible = false;
}

// sparkles when something is created
const sparkles = [];
function burst(at) {
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.12), new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.9, 0.65) }));
    m.position.set(at.x, 1.2, at.z);
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9 + 0.4, Math.random() - 0.5).normalize().multiplyScalar(4 + Math.random() * 4);
    scene.add(m); sparkles.push({ m, v, life: 1.2 });
  }
}
function updateSparkles(dt) {
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i]; s.life -= dt; s.v.y -= 9 * dt;
    s.m.position.addScaledVector(s.v, dt); s.m.rotation.x += dt * 5; s.m.scale.setScalar(Math.max(0.01, s.life));
    if (s.life <= 0 || s.m.position.y < 0) { scene.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); sparkles.splice(i, 1); }
  }
}

// ======================================================================
// Screens
// ======================================================================
let mode = 'draw';
let worldLoaded = false;
function renderStrip() {
  const strip = $('strip'); strip.innerHTML = '';
  for (const d of doodles) {
    const b = document.createElement('div'); b.className = 'thumb' + (d === selected ? ' on' : ''); b.dataset.id = d.entry.id;
    b.setAttribute('role', 'button'); b.tabIndex = 0;
    const im = new Image(); im.alt = ''; im.src = d.entry.img; b.appendChild(im);
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove this doodle');
    x.addEventListener('click', ev => {
      ev.stopPropagation();
      if (!confirm('Take this doodle off the island? It will be gone for good.')) return;
      removeDoodleObject(d);
      saveDoodles(loadDoodles().filter(e => e.id !== d.entry.id));
      renderStrip();
    });
    b.appendChild(x);
    b.addEventListener('click', () => { cam.focus = d; cam.focusT = 2.5; poke(d); });
    strip.appendChild(b);
  }
  $('toWorldBtn').hidden = loadDoodles().length === 0;
}
async function loadWorld(skipId) {
  if (worldLoaded) return;
  worldLoaded = true;
  for (const e of loadDoodles()) if (e.id !== skipId) await addFromEntry(e, false);
}
async function showWorld(newEntry) {
  mode = 'world';
  $('draw').hidden = true; $('hud').hidden = false; canvas.hidden = false;
  await loadWorld(newEntry && newEntry.id);
  if (newEntry) {
    const d = await addFromEntry(newEntry, true);
    if (d) {
      cam.focus = d; cam.focusT = 3; cam.theta = 0; cam.phi = 1.1; cam.dist = 11;
      select(d); burst(d.pos); Sound.magic();
    }
  }
  renderStrip();
  last = performance.now();
}
function showDraw() {
  mode = 'draw';
  $('hud').hidden = true; $('draw').hidden = false; canvas.hidden = true;
  $('toWorldBtn').hidden = loadDoodles().length === 0;
}

$('createBtn').addEventListener('click', async () => {
  Sound.init();
  if (!drawn) { toast('Draw something first! ✏️'); return; }
  const pic = cutOut(paper);
  if (!pic) { toast('Draw something a bit bigger first! ✏️'); return; }
  const entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind: pen.kind, face: pen.face, img: pic.toDataURL('image/png') };
  const before = loadDoodles();
  const saved = saveDoodles(before.concat([entry]));
  if (!saved.some(e => e.id === entry.id)) toast('The island is too full to save this one, but here it is!', 3000);
  else if (saved.length < before.length + 1) {
    // an old doodle had to make room
    const keep = new Set(saved.map(e => e.id));
    for (const d of doodles.slice()) if (!keep.has(d.entry.id)) removeDoodleObject(d);
  }
  undoStack.length = 0; clearPaper();
  await showWorld(entry);
});
$('toWorldBtn').addEventListener('click', () => showWorld(null));
$('drawBtn').addEventListener('click', showDraw);

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode !== 'world') return; // nothing to draw in 3D while painting
  updateDoodles(dt);
  updateSparkles(dt);
  placeCamera(dt);
  renderer.render(scene, camera);
}
showDraw();
requestAnimationFrame(frame);
window.__doodles = { doodles, cutOut, inflate, get mode() { return mode; } };
</script>
